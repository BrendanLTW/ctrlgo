name: ctrlgo
description: "Navigation and temporary location sharing for the Klang Valley."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  drift: ^2.35.3
  firebase_core: ^5.2.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_tts: ^4.2.5
  freezed_annotation: ^3.1.0
  geolocator: ^14.1.2
  go_router: ^18.1.3
  google_maps_flutter: ^2.19.0
  intl: ^0.20.3
  json_annotation: ^4.12.0
  riverpod_annotation: ^4.0.7
  shared_preferences: ^2.5.6
  web: ^1.1.2

dev_dependencies:
  build_runner: ^2.16.2
  drift_dev: ^2.35.2
  fake_async: ^1.3.3
  flutter_test:
    sdk: flutter
  freezed: ^4.0.3
  google_maps_flutter_platform_interface: ^2.18.0
  json_serializable: ^6.15.2
  mocktail: ^1.0.5
  riverpod_generator: ^4.0.9
  very_good_analysis: ^11.0.0

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/fonts/OFL.txt
    - assets/map/
    - assets/demo/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
